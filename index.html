<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slopcheck — It clicks together in minutes. The accountability doesn't.</title>
<style>
:root {
  --paper:      #fbfbf9;
  --surface:    #ffffff;
  --ink:        #17181a;
  --ink-soft:   #4a4c50;
  --ink-faint:  #8d8f93;
  --rule:       #17181a;
  --rule-faint: #d7d7d5;
  --stamp:      #a3211c;
  --stamp-bg:   rgba(163,33,28,0.06);
  --good:       #1f5c39;
  --good-bg:    rgba(31,92,57,0.06);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --paper: #131313; --surface: #1a1a1a; --ink: #e9e8e4; --ink-soft: #aeada7; --ink-faint: #74736e;
    --rule: #e9e8e4; --rule-faint: #3a3a38; --stamp: #e2685f; --stamp-bg: rgba(226,104,95,0.1);
    --good: #6bbd8e; --good-bg: rgba(107,189,142,0.1);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #131313; --surface: #1a1a1a; --ink: #e9e8e4; --ink-soft: #aeada7; --ink-faint: #74736e;
  --rule: #e9e8e4; --rule-faint: #3a3a38; --stamp: #e2685f; --stamp-bg: rgba(226,104,95,0.1);
  --good: #6bbd8e; --good-bg: rgba(107,189,142,0.1);
}

* { box-sizing: border-box; }
html, body { margin: 0; background: var(--paper); color: var(--ink); }
body { font-family: "Times New Roman", Times, serif; line-height: 1.7; -webkit-font-smoothing: antialiased; }
html[lang="ko"] body { font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; }
.mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
.wrap { max-width: 760px; margin: 0 auto; padding: 0 28px 0 56px; position: relative; }
.wrap::before { content: ""; position: absolute; left: 28px; top: 0; bottom: 0; width: 1px; background: var(--rule-faint); }

/* ---- Lang switch ---- */
.langbar { display: flex; justify-content: flex-end; gap: 2px; padding: 14px 28px 0 56px; max-width: 760px; margin: 0 auto; }
.lang-btn { font-family: ui-monospace, monospace; font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase; background: none; border: 1px solid var(--rule-faint); color: var(--ink-faint); padding: 4px 10px; cursor: pointer; }
.lang-btn:first-child { border-right: none; }
.lang-btn.active { color: var(--paper); background: var(--ink); border-color: var(--ink); }

/* ---- Nav ---- */
.nav { padding: 20px 0 18px; border-bottom: 2px solid var(--rule); display: flex; align-items: baseline; justify-content: space-between; }
.nav-brand { font-weight: 700; font-size: 22px; letter-spacing: -0.01em; }
.nav-sub { font-family: ui-monospace, monospace; font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-faint); }

/* ---- Hero ---- */
.hero { padding: 48px 0 44px; border-bottom: 1px solid var(--rule-faint); }
.eyebrow { font-family: ui-monospace, monospace; font-size: 11px; letter-spacing: 0.08em; color: var(--stamp); margin: 0 0 18px; }
.headline { font-size: clamp(38px, 6.2vw, 64px); font-weight: 700; letter-spacing: -0.01em; line-height: 1.08; margin: 0 0 26px; text-wrap: balance; }
.sub { font-size: 17px; color: var(--ink-soft); max-width: 58ch; margin: 0; }

/* ---- Problem statement ---- */
.problem { padding: 40px 0; border-bottom: 1px solid var(--rule-faint); }
.problem-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-top: 24px; }
.problem-col { }
.problem-label { font-family: ui-monospace, monospace; font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 10px; }
.problem-col.was .problem-label { color: var(--ink-faint); }
.problem-col.now .problem-label { color: var(--stamp); }
.problem-text { font-size: 15px; color: var(--ink-soft); line-height: 1.7; }
.problem-text s { color: var(--ink-faint); }
.problem-text b { color: var(--ink); }

/* ---- Ladder ---- */
.section-title { font-family: ui-monospace, monospace; font-size: 11px; letter-spacing: 0.08em; color: var(--ink-faint); margin: 0 0 10px; padding-top: 46px; }
.section-head { font-size: clamp(24px, 3.4vw, 32px); font-weight: 700; letter-spacing: -0.005em; line-height: 1.3; margin: 0 0 30px; text-wrap: balance; }

.tier { display: grid; grid-template-columns: 90px 1fr; gap: 0; border-top: 1px solid var(--rule-faint); }
.tier:last-child { border-bottom: 1px solid var(--rule-faint); }
.tier-level { padding: 26px 0; display: flex; flex-direction: column; align-items: center; }
.tier-num { font-family: ui-monospace, monospace; font-size: 34px; font-weight: 700; color: var(--rule-faint); letter-spacing: -0.02em; }
.tier-line { width: 1px; flex: 1; background: var(--rule-faint); margin-top: 8px; }
.tier:last-child .tier-line { display: none; }
.tier-body { padding: 26px 0 26px 22px; border-left: 1px solid var(--rule-faint); }
.tier-name-row { display: flex; align-items: baseline; gap: 14px; margin-bottom: 8px; flex-wrap: wrap; }
.tier-name { font-size: 27px; font-weight: 700; letter-spacing: -0.005em; }
.tier-price { font-family: ui-monospace, monospace; font-size: 16px; color: var(--stamp); font-weight: 700; }
.tier-role { font-family: ui-monospace, monospace; font-size: 10.5px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-faint); margin-bottom: 12px; }
.tier-desc { font-size: 14.5px; color: var(--ink-soft); line-height: 1.7; margin: 0 0 14px; max-width: 56ch; }
.tier-for { font-size: 13.5px; padding: 10px 14px; border-left: 3px solid var(--rule-faint); color: var(--ink-soft); margin-bottom: 14px; }
.tier-for b { color: var(--ink); }
.tier-cta { font-family: ui-monospace, monospace; font-size: 12.5px; font-weight: 700; color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--ink); padding-bottom: 2px; }
.tier-cta:hover { color: var(--stamp); border-color: var(--stamp); }
.tier-cta.quiet { color: var(--ink-faint); border-color: var(--rule-faint); cursor: default; pointer-events: none; }

/* ---- Self-select ---- */
.select-box { border: 1px solid var(--ink); padding: 26px 26px 28px; margin-top: 44px; }
.select-tag { font-family: ui-monospace, monospace; font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase; border-bottom: 1px solid var(--ink); display: inline-block; padding-bottom: 3px; margin-bottom: 16px; }
.select-item { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--rule-faint); font-size: 14.5px; }
.select-item:last-child { border-bottom: none; }
.select-item b { flex: none; width: 84px; color: var(--stamp); font-family: ui-monospace, monospace; font-size: 12px; }

/* ---- Signup ---- */
.signup { border: 1px solid var(--rule); background: var(--stamp-bg); padding: 30px 30px 32px; margin-top: 56px; }
.signup-desc { font-size: 14.5px; color: var(--ink-soft); max-width: 54ch; margin: 0 0 20px; }
.signup-form { display: flex; gap: 10px; flex-wrap: wrap; }
.signup-input { flex: 1 1 240px; font: 14.5px "Times New Roman", Times, serif; font-family: inherit; padding: 11px 14px; border: 1px solid var(--ink); background: var(--surface); color: var(--ink); border-radius: 0; }
.signup-input::placeholder { color: var(--ink-faint); }
.signup-input:focus { outline: 2px solid var(--stamp); outline-offset: 1px; }
.signup-submit { font-family: ui-monospace, monospace; font-size: 12.5px; font-weight: 700; letter-spacing: 0.02em; padding: 11px 20px; background: var(--ink); color: var(--paper); border: 1px solid var(--ink); cursor: pointer; }
.signup-submit:hover { background: var(--stamp); border-color: var(--stamp); }
.signup-note { font-family: ui-monospace, monospace; font-size: 11px; color: var(--ink-faint); margin: 14px 0 0; }
.signup-status { font-size: 13.5px; margin-top: 12px; display: none; }
.signup-status.show { display: block; }
.signup-status.ok { color: var(--good); }
.signup-status.err { color: var(--stamp); }

/* ---- Footer ---- */
.footer { margin-top: 50px; padding: 26px 0 56px; border-top: 2px solid var(--ink); font-size: 12px; color: var(--ink-faint); }

@media (max-width: 640px) {
  .wrap, .langbar { padding-left: 40px; }
  .headline { font-size: 30px; }
  .problem-grid { grid-template-columns: 1fr; gap: 20px; }
  .tier { grid-template-columns: 56px 1fr; }
  .signup-form { flex-direction: column; }
}
</style>
</head>

    });
    document.querySelectorAll("[data-i18n-placeholder]").forEach(function (el) {
      var key = el.getAttribute("data-i18n-placeholder");
      if (dict[key] !== undefined) el.placeholder = dict[key];
    });
    document.querySelectorAll(".lang-btn").forEach(function (btn) {
      btn.classList.toggle("active", btn.getAttribute("data-lang") === lang);
    });
  }

  document.querySelectorAll(".lang-btn").forEach(function (btn) {
    btn.addEventListener("click", function () {
      render(btn.getAttribute("data-lang"));
    });
  });

  render("en");

  // ---- signup form ----
  // Deployed after the Apps Script web app exists — replace this constant.
  var SIGNUP_ENDPOINT = "https://script.google.com/macros/s/AKfycbxOL4psOdThIltFEUCMUbn6DdFcRJQ3oYfboHYZvELklUkk_2gTC53EhYKvSbLv6ece/exec";

  var form = document.getElementById("signup-form");
  var status = document.getElementById("signup-status");

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var email = form.email.value.trim();
    if (!email) return;

    var dict = I18N[current];
    status.className = "signup-status show";
    status.textContent = dict.signupSending;

    if (SIGNUP_ENDPOINT.indexOf("SLOPCHECK_SIGNUP_ENDPOINT") !== -1) {
      status.className = "signup-status show err";
      status.textContent = dict.signupNotConnected;
      return;
    }

    fetch(SIGNUP_ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "text/plain" },
      body: JSON.stringify({ email: email, source: "landing", lang: current })
    })
      .then(function () {
        status.className = "signup-status show ok";
        status.textContent = dict.signupOk;
        form.reset();
      })
      .catch(function () {
        status.className = "signup-status show err";
        status.textContent = dict.signupFail;
      });
  });
})();
</script>
</body>
</html>
